services:

  # Elasticsearch Docker Images: https://www.docker.elastic.co/
  # Keep the major version in step with the Elastic.Clients.Elasticsearch package.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: elasticsearch
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    ports:
      - 9201:9200
      - 9301:9300

