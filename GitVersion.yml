# Trunk-based, tag-driven releases: master is the only long-lived branch.
# - Untagged master commits publish as {next}-preview.{n}; feature/* builds are not published.
# - Stable versions come only from pushing a SemVer tag (e.g. 1.6.0) on a master commit.
# GitHubFlow/v1 rather than TrunkBased/preview1: the latter's Mainline strategy bumps the version on every
# master commit (each commit is a release), so previews would run ahead of the version being tagged.
# Modes use GitVersion 6 names: ContinuousDelivery = pre-release label + incrementing number until tagged.
workflow: GitHubFlow/v1
mode: ContinuousDelivery
next-version: 1.6.0

branches:
  main:
    mode: ContinuousDelivery
    label: preview
    increment: Minor
    regex: ^master$|^main$
    is-main-branch: true
    prevent-increment:
      of-merged-branch: true
      when-current-commit-tagged: true

  feature:
    mode: ContinuousDelivery
    label: '{BranchName}'
    increment: Inherit
    regex: ^features?[/-](?<BranchName>.+)
    source-branches: [main]

  pull-request:
    mode: ContinuousDelivery
    label: PullRequest{Number}
    increment: Inherit
    regex: ^(pull-requests|pull|pr)[/-](?<Number>\d*)
    source-branches: [main, feature]

  # CI tag builds check out a detached HEAD, which GitVersion treats as the unknown branch.
  unknown:
    prevent-increment:
      when-current-commit-tagged: true
