name: CI

# Trunk-based: master pushes publish previews, SemVer tags publish stable releases.
# See GitVersion.yml for how versions are derived.
on:
  push:
    branches: [master, main, "feature/**"]
    tags: ["*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ["8.0.x", "9.0.x", "10.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore EventHorizon.sln

      - name: Build
        run: dotnet build EventHorizon.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test EventHorizon.sln --configuration ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=results.trx" --filter "Category!=Integration"
        continue-on-error: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: version
        uses: gittools/actions/gitversion/execute@v4

      # A stable release must be an exact SemVer tag on a commit already on master,
      # and GitVersion must agree with the tag; anything else fails before packing.
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          SEMVER: ${{ steps.version.outputs.semVer }}
        run: |
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a stable SemVer tag (expected e.g. 1.6.0)"; exit 1
          fi
          if [ "${TAG#v}" != "$SEMVER" ]; then
            echo "::error::GitVersion computed '$SEMVER' for tag '$TAG'"; exit 1
          fi
          if ! git branch -r --contains "$GITHUB_SHA" | grep -Eq 'origin/(master|main)$'; then
            echo "::error::Tagged commit $GITHUB_SHA is not on master"; exit 1
          fi

      - name: Restore
        run: dotnet restore EventHorizon.sln

      - name: Build
        run: dotnet build EventHorizon.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Pack NuGet packages
        run: |
          VERSION="${{ steps.version.outputs.semVer }}"
          for proj in src/EventHorizon.*/EventHorizon.*.csproj; do
            ASSEMBLY_NAME=$(basename "$(dirname "$proj")")
            PACKAGE_ID="${ASSEMBLY_NAME}"
            echo "Packing ${PACKAGE_ID} v${VERSION}"
            dotnet pack "$proj" \
              --configuration ${{ env.CONFIGURATION }} \
              --no-build \
              --output ./artifacts \
              -p:PackageId="${PACKAGE_ID}" \
              -p:PackageVersion="${VERSION}" \
              -p:Version="${VERSION}"
          done

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: potatman

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 30
